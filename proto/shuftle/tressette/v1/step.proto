syntax = "proto3";

package shuftle.tressette.v1;

import "shuftle/cards/v1/italian.proto";
import "shuftle/tressette/v1/actions.proto";
import "shuftle/tressette/v1/seats.proto";

// One stored step of a game. Holds the full deal: never sent to clients as is.
message Step {
  // The kind of step.
  oneof kind {
    // A deal.
    Deal deal = 1;
    // A seat's action.
    Act act = 2;
    // A seat's forfeit.
    Forfeit forfeit = 3;
  }
}

// The chance outcome of tressette: a whole deal.
message Deal {
  // The seat that dealt.
  Seat dealer = 1;
  // North's hand.
  Hand north = 2;
  // East's hand.
  Hand east = 3;
  // South's hand.
  Hand south = 4;
  // West's hand.
  Hand west = 5;
}

// The cards one seat holds.
message Hand {
  // The ten cards dealt to the seat.
  repeated shuftle.cards.v1.ItalianCard cards = 1;
}

// A seat acting.
message Act {
  // The seat that acted.
  Seat seat = 1;
  // The action it took.
  Action action = 2;
}

// A seat forfeiting.
message Forfeit {
  // The seat that forfeited.
  Seat seat = 1;
}
