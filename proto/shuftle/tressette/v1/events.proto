syntax = "proto3";

package shuftle.tressette.v1;

import "shuftle/cards/v1/italian.proto";
import "shuftle/tressette/v1/actions.proto";
import "shuftle/tressette/v1/seats.proto";

// What one step did, as one viewer may see it: its notice and the events that reach the viewer.
message Update {
  Notice notice = 1;
  repeated Event events = 2;
}

// What kind of step happened. Public: every viewer receives it.
message Notice {
  oneof kind {
    ChanceNotice chance = 1;
    ActedNotice acted = 2;
    ForfeitNotice forfeit = 3;
  }
}

// A chance outcome was applied.
message ChanceNotice {}

// A seat acted.
message ActedNotice {
  Seat seat = 1;
}

// A seat forfeited.
message ForfeitNotice {
  Seat seat = 1;
}

// Something that happened in the game.
message Event {
  oneof kind {
    HandDealt hand_dealt = 1;
    CardsReceived cards_received = 2;
    CardPlayed card_played = 3;
    Signalled signalled = 4;
    Declared declared = 5;
    TrickTaken trick_taken = 6;
    HandScored hand_scored = 7;
    Forfeited forfeited = 8;
    GameWon game_won = 9;
  }
}

// A new hand was dealt.
message HandDealt {
  Seat dealer = 1;
}

// The receiving seat was dealt these cards. Only that seat receives it.
message CardsReceived {
  repeated shuftle.cards.v1.ItalianCard cards = 1;
}

// A card was played.
message CardPlayed {
  Seat seat = 1;
  shuftle.cards.v1.ItalianCard card = 2;
}

// The seat that just led the trick gave a signal with its card.
message Signalled {
  Seat seat = 1;
  Signal signal = 2;
}

// A seat made a declaration.
message Declared {
  Seat seat = 1;
  uint32 points = 2;
  // Unset when the rules keep the declaration hidden.
  optional Declaration declaration = 3;
}

// A trick was completed. Its taker leads the next one.
message TrickTaken {
  CompletedTrick trick = 1;
}

// Every card of the hand was played and the hand was scored.
message HandScored {
  // What each team scored in this hand.
  PerTeam points = 1;
  // The score of the game, this hand included.
  PerTeam score = 2;
}

// A seat forfeited, losing the game for its team.
message Forfeited {
  Seat seat = 1;
}

// The game is over.
message GameWon {
  Team winner = 1;
}

// A trick whose four cards have been played.
message CompletedTrick {
  Seat leader = 1;
  // In play order, starting from the leader.
  repeated shuftle.cards.v1.ItalianCard cards = 2;
  Seat taker = 3;
  // The signal given with the lead, if any.
  optional Signal signal = 4;
}
