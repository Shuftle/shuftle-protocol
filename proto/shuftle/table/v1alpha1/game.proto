// The per-game wrappers: one oneof field per game, so a table carries any game with its own types.
syntax = "proto3";

package shuftle.table.v1alpha1;

import "shuftle/table/v1alpha1/clock.proto";
import "shuftle/tressette/v1alpha1/actions.proto";
import "shuftle/tressette/v1alpha1/config.proto";
import "shuftle/tressette/v1alpha1/events.proto";
import "shuftle/tressette/v1alpha1/step.proto";
import "shuftle/tressette/v1alpha1/view.proto";

// The game a table plays, the rules it is played with and its time control.
message Config {
  // The game and its rules.
  oneof game {
    // Tressette, with its rules.
    shuftle.tressette.v1alpha1.Config tressette = 1;
  }
  // The time the seats have to act.
  TimeControl time_control = 2;
}

// The action a seat takes, in the game played at the table.
message Action {
  // The action, in the game's own types.
  oneof game {
    // A tressette action.
    shuftle.tressette.v1alpha1.Action tressette = 1;
  }
}

// Everything the subscriber is allowed to know about the game, in the game played at the table.
message View {
  // The view, in the game's own types.
  oneof game {
    // A tressette view.
    shuftle.tressette.v1alpha1.View tressette = 1;
  }
}

// What one step did, as the subscriber may see it.
message Update {
  // The update, in the game's own types.
  oneof game {
    // A tressette update.
    shuftle.tressette.v1alpha1.Update tressette = 1;
  }
}

// One stored step, in the game played at the table. Never sent to clients.
message StepRecord {
  // The step, in the game's own types.
  oneof game {
    // A tressette step.
    shuftle.tressette.v1alpha1.Step tressette = 1;
  }
}
